# dsh-mu gateway — HTTP-level fragment.
#
# Installed to <NGINX_CONF_D_DIR>/dsh-mu-http.conf and pulled in by a managed
# `include` line that dsh-muctl inserts inside the main nginx.conf's http{}.
# Keep every directive here HTTP-level: this file must not contain a server{}.

# Platform diagnostics land here (the distribution nginx.conf leaves its own
# error_log commented out, so WARN/NOTICE from our Lua would otherwise vanish).
error_log                   /var/log/dsh-mu/gateway.err.log warn;

# Cached state views, login rate limits and the gateway session secret store.
lua_shared_dict             dshmu 16m;
lua_package_path            "/usr/local/lib/dsh-mu/lua/?.lua;;";
lua_code_cache              on;
lua_socket_log_errors       off;

# Only send "Connection: upgrade" when the client actually asked for it.
map $http_upgrade $connection_upgrade {
    default                 upgrade;
    ''                      close;
}
