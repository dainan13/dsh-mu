# dsh-mu gateway — server fragment.
#
# Installed to <NGINX_HTTP_D_DIR>/dsh-mu-server.conf and pulled in by a managed
# `include` line inside the main nginx.conf's http{}. dsh-muctl fills in the
# listen port, the optional default_server flag and the server_name list from
# /etc/dsh-mu/dsh-mu.conf.
#
# Routing: /login /logout /mu-api/* are served by Lua; everything else is
# proxied to the caller's own jailed harness instance with an injected cookie.

server {
@LISTEN_DIRECTIVES@    server_name             @SERVER_NAMES@;

    access_log              /var/log/dsh-mu/gateway.log;

    # dsh attachments / uploads
    client_max_body_size    512m;

    # The harness page links a root-relative PWA manifest. Without a real one the
    # request fell through to the auth redirect, and the browser then tried to parse
    # our HTML login page as JSON ("Manifest: Line: 1, column: 1, Syntax error").
    # Serve a valid manifest before authentication: it is public and tiny.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header   Cache-Control "public, max-age=3600";
        return 200 '{"name":"DSH 多实例平台","short_name":"DSH","start_url":"/","scope":"/","display":"standalone","background_color":"#0e1116","theme_color":"#0e1116","icons":[]}';
    }

    # ---------------------------------------------------------------- auth
    location = /login {
        content_by_lua_file /usr/local/lib/dsh-mu/lua/login.lua;
    }

    location = /logout {
        content_by_lua_file /usr/local/lib/dsh-mu/lua/logout.lua;
    }

    # Local ops API: never reachable from the network.
    location ^~ /mu-api/ {
        allow               127.0.0.1;
        deny                all;
        content_by_lua_file /usr/local/lib/dsh-mu/lua/api.lua;
    }

    # -------------------------------------------------- gateway-to-backend API
    # Reached only by the gateway's own subrequests: the shared admin token must
    # be present in X-DSH-MU-Internal (a browser can never know it).
    location ^~ /mu-internal/ {
        # No Lua here on purpose: access_by_lua_file is not run for
        # ngx.location.capture subrequests, so the gate is the backend's token
        # check. The token travels in ?t= (a browser cannot know it) and the
        # acting username in ?a=; access logging is off so neither is logged.
        proxy_pass          http://127.0.0.1:8787/api/;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-DSH-MU-Admin    $arg_t;
        proxy_set_header    X-DSH-MU-User     $arg_a;
        proxy_set_header    Cookie            "";
        proxy_read_timeout  300s;
        access_log          off;
    }

    # Session-scoped JSON for the in-page user panel (/me) and its static files.
    location = /me {
        content_by_lua_file /usr/local/lib/dsh-mu/lua/me.lua;
    }

    location ^~ /mu-static/ {
        alias               /usr/local/lib/dsh-mu/static/;
        access_log          off;
        expires             10m;
        add_header          Cache-Control "public, max-age=600";
    }

    # ------------------------------------------------------------- admin API
    # The loopback backend (dsh-mud) serves the admin page and its JSON API;
    # admin.lua checks the platform session and role=admin first, then injects
    # the shared token and the acting username.
    location = /admin {
        return 302 /admin/;
    }

    location ^~ /admin/ {
        set                 $admin_token "";
        set                 $admin_user "";
        set                 $admin_must_change "";

        access_by_lua_file  /usr/local/lib/dsh-mu/lua/admin.lua;

        proxy_pass          http://127.0.0.1:8787/;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-DSH-MU-Admin    $admin_token;
        proxy_set_header    X-DSH-MU-User     $admin_user;
        proxy_set_header    X-DSH-MU-Must-Change $admin_must_change;
        # The browser's platform cookie must not travel to the backend.
        proxy_set_header    Cookie            "";
        proxy_set_header    Accept-Encoding   "";
        proxy_read_timeout  300s;
        proxy_connect_timeout 10s;
        error_page 502 503 504 = @gw_admin_down;
    }

    location @gw_admin_down {
        default_type        text/html;
        return 503 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>管理后端不可用</title></head><body style="font:15px/1.6 system-ui,sans-serif;background:#0f1115;color:#e6e8eb;padding:40px"><h1 style="font-size:18px">管理后端不可用</h1><p style="color:#aeb6c2">dsh-mud 没有响应。请在服务器上执行：</p><pre style="background:#171a21;border:1px solid #262b36;border-radius:8px;padding:12px">dsh-muctl admin status
dsh-muctl admin restart</pre><p><a style="color:#7aa2ff" href="/">返回实例</a></p></body></html>';
    }

    # ------------------------------------------------------------- proxying
    location @gw_down {
        content_by_lua_file /usr/local/lib/dsh-mu/lua/down.lua;
    }

    # The harness index carries the platform session, but its own UI knows
    # nothing about logout, so inject a small fixed link into the served index
    # HTML. Scoped to the index request only: assets, /api and the WebSocket
    # keep the streaming-friendly block below untouched.
    location = / {
        set                 $gw_upstream "";
        set                 $gw_cookie "";
        set                 $gw_user "";

        access_by_lua_file  /usr/local/lib/dsh-mu/lua/auth.lua;

        proxy_pass          http://$gw_upstream;
        proxy_http_version  1.1;
        proxy_set_header    Host              $gw_upstream;
        proxy_set_header    Origin            http://$gw_upstream;
        proxy_set_header    Cookie            $gw_cookie;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-DSH-MU-User     $gw_user;
        # Read the index uncompressed so the body filter can match it.
        proxy_set_header    Accept-Encoding   "";
        proxy_buffering     on;
        sub_filter_once     on;
        sub_filter          '</body>' '<div id="dshmu-panel-root"></div><script src="/mu-static/panel.js?v=@VERSION@" defer></script></body>';
        proxy_read_timeout  3600s;
        proxy_connect_timeout 10s;
        error_page 502 503 504 = @gw_down;
    }

    location / {
        set                 $gw_upstream "";
        set                 $gw_cookie "";
        set                 $gw_user "";

        access_by_lua_file  /usr/local/lib/dsh-mu/lua/auth.lua;

        proxy_pass          http://$gw_upstream;
        proxy_http_version  1.1;

        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        $connection_upgrade;
        # Fixed upstream authority: the trust fence accepts loopback and the
        # injected cookie is bound to this same authority.
        proxy_set_header    Host              $gw_upstream;
        proxy_set_header    Origin            http://$gw_upstream;
        proxy_set_header    Cookie            $gw_cookie;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-DSH-MU-User     $gw_user;

        # WebSocket (/api/remote.mux) and streamed responses must survive.
        proxy_buffering     off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;

        error_page 502 503 504 = @gw_down;
    }
}
