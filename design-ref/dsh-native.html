-bottom:0}</style><style id="@dsh-mu/dsh-ssh/client">/* 「远端（SSH）」panel — theme-agnostic, built on the shell's design tokens. */

/* Session-header entry: mounted resources as chips + (+).  The header action
   list sits next to the session title, above the 对话/轨迹 tabs. */
.mus-hd {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  max-width: min(44vw, 520px);
}
.mus-hd-chips {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  overflow: hidden;
  flex: 0 1 auto;
}
.mus-hd-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex: none;
  height: 24px;
  max-width: 168px;
  padding: 0 7px;
  border: 1px solid var(--dsw-alias-border-l2, rgba(127, 127, 127, 0.24));
  border-radius: var(--dsw-radius-sm, 6px);
  background: transparent;
  color: var(--dsw-alias-label-secondary, inherit);
  font: inherit;
  font-size: 12px;
  line-height: 22px;
  white-space: nowrap;
  cursor: pointer;
}
.mus-hd-chip:hover {
  background: var(--dsw-alias-interactive-bg-hover, rgba(127, 127, 127, 0.12));
  color: var(--dsw-alias-label-primary, inherit);
}
.mus-hd-chip.is-inherited {
  border-style: dashed;
}
.mus-hd-glyph {
  display: inline-flex;
  flex: none;
}
.mus-hd-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mus-hd-add,
.mus-hd-more {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  flex: none;
  height: 24px;
  min-width: 24px;
  padding: 0 6px;
  border: 1px solid var(--dsw-alias-border-l2, rgba(127, 127, 127, 0.24));
  border-radius: var(--dsw-radius-sm, 6px);
  background: transparent;
  color: var(--dsw-alias-label-secondary, inherit);
  font: inherit;
  font-size: 12px;
  line-height: 22px;
  cursor: pointer;
}
.mus-hd-add:hover,
.mus-hd-more:hover {
  background: var(--dsw-alias-interactive-bg-hover, rgba(127, 127, 127, 0.12));
  color: var(--dsw-alias-label-primary, inherit);
}
.mus-hd-add.is-empty {
  padding: 0 6px;
}
.mus-hd-plus {
  color: var(--dsw-alias-label-tertiary, inherit);
}

.mus-layer {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  justify-content: flex-end;
  padding: 12px;
}
.mus-scrim {
  position: absolute;
  inset: 0;
  border: 0;
  padding: 0;
  background: var(--dsw-alias-bg-mask-1, rgba(0, 0, 0, 0.42));
  cursor: default;
}
.mus-drawer {
  position: relative;
  display: flex;
  flex-direction: column;
  width: min(420px, calc(100vw - 24px));
  max-height: 100%;
  border: 1px solid var(--dsw-alias-border-l3, rgba(127, 127, 127, 0.28));
  border-radius: var(--dsw-radius-panel, 16px);
  background: var(--dsw-alias-bg-layer-2, #171a21);
  color: var(--dsw-alias-label-primary, inherit);
  box-shadow: var(--dsw-elevation-prominent, 0 18px 48px rgba(0, 0, 0, 0.4));
  overflow: hidden;
}

.mus-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 16px 10px;
  border-bottom: 1px solid var(--dsw-alias-border-l4, rgba(127, 127, 127, 0.18));
}
.mus-head-copy h2 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
}
.mus-head-copy p {
  margin: 4px 0 0;
  font-size: 12px;
  color: var(--dsw-alias-label-tertiary, rgba(140, 146, 158, 0.95));
}
.mus-icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: var(--dsw-radius-sm, 8px);
  background: transparent;
  color: inherit;
  cursor: pointer;
}
.mus-icon-button:hover {
  background: var(--dsw-alias-interactive-bg-hover, rgba(127, 127, 127, 0.14));
}

.mus-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 12px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.mus-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.mus-section-head {
  display: flex;
  align-items: center;
  gap: 8px;
}
.mus-section-head h3 {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--dsw-alias-label-tertiary, rgba(140, 146, 158, 0.95));
}
.mus-count {
  min-width: 18px;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--dsw-alias-bg-layer-3, rgba(127, 127, 127, 0.16));
  font-size: 11px;
  text-align: center;
  color: var(--dsw-alias-label-secondary, inherit);
}
.mus-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.mus-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--dsw-alias-border-l4, rgba(127, 127, 127, 0.18));
  border-radius: var(--dsw-radius-md, 10px);
  background: var(--dsw-alias-bg-layer-3, rgba(127, 127, 127, 0.06));
}
.mus-card-copy {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.mus-card-copy strong {
  font-size: 13px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mus-card-copy small {
  font-size: 11px;
  color: var(--dsw-alias-label-tertiary, rgba(140, 146, 158, 0.95));
}
.mus-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 4px;
}

.mus-alert {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px;
  border: 1px solid var(--dsw-alias-border-l4, rgba(127, 127, 127, 0.2));
  border-left: 3px solid var(--dsw-alias-state-warn-primary, #c99a2e);
  border-radius: var(--dsw-radius-md, 10px);
  background: var(--dsw-alias-bg-layer-3, rgba(127, 127, 127, 0.07));
}
.mus-alert.is-error {
  border-left-color: var(--dsw-alias-state-error-primary, #d05b5b);
}
.mus-alert strong {
  font-size: 13px;
}
.mus-alert p {
  margin: 0;
  font-size: 12px;
  line-height: 1.55;
  color: var(--dsw-alias-label-secondary, inherit);
}
.mus-alert code {
  padding: 1px 4px;
  border-radius: 4px;
  background: var(--dsw-alias-bg-layer-3, rgba(127, 127, 127, 0.16));
  font-size: 11px;
}
.mus-code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 22px;
  letter-spacing: 0.28em;
  color: var(--dsw-alias-label-primary, inherit);
}
.mus-row-actions {
  display: flex;
  gap: 8px;
  margin-top: 2px;
}
.mus-muted {
  margin: 0;
  font-size: 12px;
  line-height: 1.55;
  color: var(--dsw-alias-label-tertiary, rgba(140, 146, 158, 0.95));
}

.mus-foot {
  padding: 10px 16px 12px;
  border-top: 1px solid var(--dsw-alias-border-l4, rgba(127, 127, 127, 0.18));
  font-size: 11px;
  color: var(--dsw-alias-label-tertiary, rgba(140, 146, 158, 0.95));
}

.mus-dialog-body {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 320px;
}
.mus-dialog-target {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
}
.mus-fieldset {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 0;
  padding: 10px 12px;
  border: 1px solid var(--dsw-alias-border-l4, rgba(127, 127, 127, 0.2));
  border-radius: var(--dsw-radius-md, 10px);
}
.mus-fieldset legend {
  padding: 0 4px;
  font-size: 11px;
  color: var(--dsw-alias-label-tertiary, rgba(140, 146, 158, 0.95));
}
.mus-switch-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}
.mus-dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

@media (max-width: 560px) {
  .mus-layer {
    padding: 0;
  }
  .mus-drawer {
    width: 100vw;
    max-height: 100vh;
    border-radius: 0;
  }
}

      if (el.children.length <= 2 && /^dainan\s*·\s*运行中/.test(t)) el.remove();
    });
    cur.replaceWith(fresh);
    if (collapsed) {
      // 折叠态：放进 panelList（和 Plugins/Tasks 同一个列表），上下间距才一致
      const list = fresh.querySelector('.hHd-Xa_panelList');
      if (list) list.insertBefore(host, list.firstChild);
      else fresh.appendChild(host);
    } else {
      const newBtn = fresh.querySelector('.hHd-Xa_newSession')
        || [...fresh.querySelectorAll('button')].find(b => b.textContent.trim() === 'New Session');
      if (newBtn) newBtn.after(host);
      else if (fresh.children[1]) fresh.children[1].after(host);
      else fresh.appendChild(host);
    }
  }

  function paint() {
    host.style.cssText = collapsed
      ? 'display:block;width:36px;margin:0 auto;pointer-events:auto'
      : 'display:block;pointer-events:auto';
    sh.getElementById('slot').innerHTML = collapsed ? railHTML : cardHTML;
    const el = sh.getElementById(collapsed ? 'rail' : 'card');
    if (el) el.addEventListener('click', () => osh.getElementById('f2').classList.add('on'));
  }
  mountSide(); paint();
  osh.getElementById('close').addEventListener('click', () => osh.getElementById('f2').classList.remove('on'));
  osh.getElementById('logout').addEventListener('click', () => osh.getElementById('f2').classList.remove('on'));
  const actsEl = osh.querySelector('.acts');
  const actsHTML = actsEl.innerHTML;
  function bootHTML(pct) {
    const lines = ['> restart instance dainan', '  stopping supervisor ......... ok',
      '  releasing :3100 ............. ok', '  starting container', '  checking health <span class="bc"></span>'];
    return '<div class="boot">' + lines.map(t => '<div class="bl">' + t + '</div>').join('') +
      '<div class="bt"><i style="width:' + pct + '%"></i></div></div>';
  }
  function doRestart() {
    if (actsEl.dataset.busy === '1') return;
    actsEl.dataset.busy = '1';
    const st = osh.querySelector('.st');
    if (st) { st.textContent = '重启中'; st.style.color = '#8a5a00'; }
    actsEl.innerHTML = bootHTML(0);
    const fill = actsEl.querySelector('.bt i');
    setTimeout(() => { if (fill) fill.style.width = '100%'; }, 60);
    setTimeout(() => {
      actsEl.dataset.busy = '0';
      actsEl.innerHTML = actsHTML;
      const st2 = osh.querySelector('.st');
      if (st2) { st2.textContent = '运行中'; st2.style.color = '#16a34a'; }
      const r = osh.getElementById('restart');
      if (r) r.addEventListener('click', doRestart);
    }, 3400);
  }
  actsEl.addEventListener('click', (e) => {
    const b = e.target.closest('#restart');
    if (b) doRestart();
  });
  window.__f2BootPreview = () => {
    actsEl.innerHTML = bootHTML(62);
    const st = osh.querySelector('.st');
    if (st) { st.textContent = '重启中'; st.style.color = '#8a5a00'; }
  };
  osh.getElementById('logRefresh').addEventListener('click', () => {});
  osh.getElementById('logCopy').addEventListener('click', () => {});
  osh.getElementById('f2').addEventListener('click', (e) => { if (e.target.id === 'f2') osh.getElementById('f2').classList.remove('on'); });

  document.getElementById('btnCollapse').addEventListener('click', () => {
    collapsed = !collapsed;
    if (frame) frame.style.gridTemplateColumns = COLS(collapsed ? 56 : 280);
    mountSide(); paint();
  });
  document.getElementById('btnTheme').addEventListener('click', () => {
    document.body.toggleAttribute('data-ds-dark-theme');
    document.documentElement.dataset.theme = document.body.hasAttribute('data-ds-dark-theme') ? 'dark' : 'light';
  });
  document.getElementById('btnF2').addEventListener('click', () => osh.getElementById('f2').classList.add('on'));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'F2') { e.preventDefault(); osh.getElementById('f2').classList.add('on'); }
    if (e.key === 'Escape') osh.getElementById('f2').classList.remove('on');
  });
  /* ── 更多菜单（真机菜单壳 + 我们的三项） ─────────────────────────── */
  const menuLayer = document.getElementById('menuLayer');
  const setLayer = document.getElementById('setLayer');
  const TPL_MENU = document.getElementById('tpl-menu').textContent;
  const TPL_SETTINGS = document.getElementById('tpl-settings').textContent;

  const GEAR = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="8" cy="8" r="2.2"></circle><path d="M13 8a5 5 0 0 0-.1-1l1.3-1-1-1.7-1.5.6a5 5 0 0 0-1.7-1L9.7 2H7.3l-.3 1.9a5 5 0 0 0-1.7 1l-1.5-.6-1 1.7 1.3 1a5 5 0 0 0 0 2l-1.3 1 1 1.7 1.5-.6a5 5 0 0 0 1.7 1l.3 1.9h2.4l.3-1.9a5 5 0 0 0 1.7-1l1.5.6 1-1.7-1.3-1c.06-.33.1-.66.1-1Z"></path></svg>';
  const USER = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="8" cy="5.6" r="2.6"></circle><path d="M2.8 13.6c.7-2.3 2.8-3.6 5.2-3.6s4.5 1.3 5.2 3.6"></path></svg>';
  const OUT = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M6.5 2.5H3.5v11h3"></path><path d="M9 5l3 3-3 3M12 8H6.5"></path></svg>';

  function menuItem(label, icon, onClick) {
    const wrap = document.createElement('div');
    wrap.className = '_itemWrap_4ub78_90';
    wrap.innerHTML = `<button type="button" role="menuitem" class="_item_4ub78_90">
      <span class="_itemIcon_4ub78_148">${icon}</span>
      <span class="_itemLabel_4ub78_190">${label}</span></button>`;
    wrap.querySelector('button').addEventListener('click', () => { toggleMenu(false); onClick(); });
    return wrap;
  }

  function toggleMenu(force) {
    const on = typeof force === 'boolean' ? force : !menuLayer.dataset.on;
    if (!on) { menuLayer.innerHTML = ''; delete menuLayer.dataset.on; return; }
    menuLayer.dataset.on = '1';
    menuLayer.innerHTML = TPL_MENU;
    const menu = menuLayer.querySelector('[role=menu]');
    menu.style.position = 'fixed';
    menu.style.left = '12px'; menu.style.top = 'auto'; menu.style.bottom = '56px';
    menu.style.background = 'var(--dsw-alias-bg-layer-1, #fff)';
    menu.style.border = '1px solid var(--dsw-alias-border-l2, #e6e8eb)';
    menu.style.borderRadius = '10px';
    menu.style.boxShadow = '0 12px 32px rgba(0,0,0,.16)';
    menu.style.padding = '4px';
    const view = menu.querySelector('.viewport_4ub78_19') || menu.querySelector('[role=presentation]');
    view.innerHTML = '';
    view.appendChild(menuItem('设置', GEAR, () => openSettings()));
    view.appendChild(menuItem('我的账号', USER, () => openAccount()));
    view.appendChild(menuItem('退出登录', OUT, () => toastish('已退出登录（原型）')));
    menu.querySelectorAll('._item_4ub78_90').forEach(b => { b.style.border = '0'; b.style.background = 'transparent'; b.style.width = '100%'; b.style.borderRadius = '6px'; });
    document.addEventListener('click', closeOnOutside, true);
  }
  function closeOnOutside(e) {
    if (!menuLayer.dataset.on) return;
    if (menuLayer.contains(e.target)) return;
    toggleMenu(false);
    document.removeEventListener('click', closeOnOutside, true);
  }

  function toastish(text) {
    const el = document.createElement('div');
    el.textContent = text;
    el.style.cssText = 'position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:2147483600;' +
      'padding:8px 14px;border-radius:8px;background:#1b1b1c;color:#fff;font:12.5px system-ui;box-shadow:0 8px 24px rgba(0,0,0,.25)';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1600);
  }

  /* ── 设置 · 模型（真机弹窗壳 + 我们自己的右栏） ───────────────────── */
  let setOpen = false;
  function openSettings() {
    setLayer.style.cssText = 'position:fixed;inset:0;z-index:2147483500;display:grid;place-items:center;background:rgba(8,10,14,.32)';
    setLayer.innerHTML = TPL_SETTINGS;
    const dlg = setLayer.querySelector('.VOzbGW_panel');
    if (dlg) { dlg.style.width = 'min(980px, 92vw)'; dlg.style.height = 'min(700px, 86vh)'; }
    const close = setLayer.querySelector('.VOzbGW_close');
    if (close) {
      close.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
      close.addEventListener('click', closeSettings);
    }
    setLayer.addEventListener('click', (e) => { if (e.target === setLayer) closeSettings(); });
    paintPane('models');
    setLayer.querySelectorAll('.VOzbGW_navCell').forEach(b => {
      b.addEventListener('click', () => {
        setLayer.querySelectorAll('.VOzbGW_navCell').forEach(x => x.classList.remove('VOzbGW_active'));
        b.classList.add('VOzbGW_active');
        paintPane(/模型/.test(b.textContent) ? 'models' : 'other');
      });
    });
    setOpen = true;
  }
  function closeSettings() { setLayer.innerHTML = ''; setLayer.style.cssText = ''; setOpen = false; }

  function paintPane(which) {
    const opts = setLayer.querySelector('.VOzbGW_options');
    if (!opts) return;
    opts.innerHTML = '<div id="muPane" style="height:100%"></div>';
    const host = opts.querySelector('#muPane');
    const sh = host.attachShadow({ mode: 'open' });
    sh.innerHTML = `<style>${CSS}</style>` + (which === 'models' ? MU_HTML : '<div class="mu"><h2>这一页没做</h2><p class="lead">原型里只做了「模型（mu）」右栏。</p></div>');
    if (which === 'models') wireMu(sh);
  }

  const MU_HTML = `
    <div class="mu">
      <h2>模型（dsh-mu）</h2>
      <p class="lead">平台托管的 provider 只能选、不能改；你自己的 key 保存在平台，加密后不回显。</p>

      <h3>我的默认模型</h3>
      <p class="hint">选中即生效；平台套餐和我添加的 key 都在一个列表里</p>
      <select id="defSel">
        <optgroup label="平台提供">
          <option>d13deepseek / deepseek-flash</option>
          <option>d13deepseek / deepseek-pro</option>
          <option>d13mygo / claude-haiku-5-5</option>
          <option>d13mygo / deepseek-v4.1-flash</option>
        </optgroup>
        <optgroup label="我添加的">
          <option>我的 groq / llama-3.1-8b</option>
        </optgroup>
      </select>

      <h3>平台提供的套餐</h3>
      <div class="pl"><span class="nm">d13deepseek</span><span class="md">mu-deepseek · deepseek-flash / deepseek-pro</span></div>
      <div class="pl"><span class="nm">d13mygo</span><span class="md">opencode-go · claude-haiku-5-5 / deepseek-v4.1-flash</span></div>

      <h3>我添加的 key</h3>
      <div class="key"><span>我的 groq</span><span class="kp">groq · 加密保存，不回显</span><button class="btn del" id="delKey">删除</button></div>

      <button class="add" id="addBtn">＋ 添加模型提供商</button>
      <div class="form" id="addForm" hidden>
        <div class="fld"><label>套餐名</label><input placeholder="例如 我的 groq"></div>
        <div class="fld"><label>provider</label><select><option>groq</option><option>openrouter</option><option>mistral</option></select></div>
        <div class="fld"><label>API Key</label><input type="password" placeholder="只发送到平台，加密保存，不回显"></div>
        <div class="row"><button class="btn" id="cancelAdd">取消</button><button class="btn primary" id="saveAdd">保存</button></div>
      </div>
    </div>`;

  function wireMu(sh) {
    const form = sh.getElementById('addForm');
    sh.getElementById('addBtn').addEventListener('click', () => { form.hidden = false; sh.getElementById('addBtn').hidden = true; });
    sh.getElementById('cancelAdd').addEventListener('click', () => { form.hidden = true; sh.getElementById('addBtn').hidden = false; });
    sh.getElementById('saveAdd').addEventListener('click', () => { form.hidden = true; sh.getElementById('addBtn').hidden = false; toastish('已添加（原型）'); });
    sh.getElementById('delKey').addEventListener('click', () => toastish('删除要二次确认（原型）'));
  }

  /* ── 我的账号（我们自己的面板） ─────────────────────────────────── */
  function openAccount() {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:2147483400;display:grid;place-items:center;background:rgba(8,10,14,.32)';
    const host = document.createElement('div');
    overlay.appendChild(host);
    document.body.appendChild(overlay);
    const sh = host.attachShadow({ mode: 'open' });
    sh.innerHTML = `<style>${CSS}</style>
      <div class="win acct">
        <div class="hd"><span class="dot"></span><span class="name">dainan</span>
          <span style="font-size:12px;color:var(--dsw-alias-label-caption,#8b939d)">账号 · dsh-mu</span></div>
        <dl class="kv">
          <dt>账号</dt><dd>dainan</dd>
          <dt>实例</dt><dd>dainan · 端口 3100 · 运行中</dd>
          <dt>套餐</dt><dd>d13deepseek（默认 deepseek-flash）</dd>
          <dt>上次登录</dt><dd>2026-11-05 00:46 · 127.0.0.1</dd>
        </dl>
        <div class="acts">
          <button class="btn" id="pw">修改密码</button>
          <button class="btn" id="closeAcct">关闭</button>
          <button class="btn" id="logoutAcct" style="color:#c0392b;border-color:rgba(192,57,43,.45)">退出登录</button>
        </div>
      </div>`;
    const close = () => overlay.remove();
    sh.getElementById('closeAcct').addEventListener('click', close);
    sh.getElementById('logoutAcct').addEventListener('click', () => { close(); toastish('已退出登录（原型）'); });
    sh.getElementById('pw').addEventListener('click', () => toastish('修改密码要原密码（原型）'));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  }

  document.getElementById('btnMenu').addEventListener('click', () => toggleMenu());
  document.getElementById('btnSettings').addEventListener('click', () => openSettings());
  document.getElementById('btnAccount').addEventListener('click', () => openAccount());

})();
</script>
</body></html>
